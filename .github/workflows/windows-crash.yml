#
# Investigation harness for #84: the binding suite links on Windows and then
# faults with an access violation on the SDK's callback thread.
#
# Dispatch-only, and expected to fail. It is not part of CI: the point is the
# evidence it leaves behind, not a pass. The emulator-windows job comes back to
# ci.yml once the crash is fixed.
#
# What this adds over the job that found the crash: the library is built with
# debug info, Windows Error Reporting is told to keep a full dump, and the dump
# is symbolized here and uploaded. A stack names a function; "firebase_ffi.dll
# +0x9b1ab" names nothing.
name: Windows crash (#84)

on:
  workflow_dispatch:

jobs:
  crash:
    name: Reproduce and symbolize
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: packages/firebase_ffi
    steps:
      - name: Enable long-path support
        shell: pwsh
        working-directory: .
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/firebase-sdk
          key: fbsdk-windows-2022-13.12.0-${{ hashFiles('packages/firebase_ffi/patches/firebase-cpp-sdk/common/*.patch', 'packages/firebase_ffi/patches/firebase-cpp-sdk/windows/*.patch', 'scripts/build_firebase_sdk.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the SDK
        working-directory: .
        env:
          PYTHON: python
        run: |
          command -v go >/dev/null || choco install golang -y --no-progress
          scripts/build_firebase_sdk.sh "$HOME/firebase-sdk"
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install the emulator callables
        working-directory: packages/firebase_ffi/test/emulator/functions
        run: npm install --no-fund --no-audit

      # debug_info keeps a PDB beside the optimized library. Without it the
      # crash resolves to an offset and the dump is no better than the log.
      - name: Point the package at the SDK, with debug info
        run: |
          python - "$HOME/firebase-sdk" <<'EOF'
          import pathlib, sys
          p = pathlib.Path('pubspec.yaml')
          p.write_text(p.read_text().replace(
              '      with_firebase: false',
              '      products: [auth, database, firestore, functions, '
              'storage, remote_config, app_check]\n'
              '      debug_info: true\n'
              f'      firebase_sdk: {sys.argv[1]}'))
          EOF
      - run: dart pub get --no-example

      # Kept, because the offset in it is the evidence: the Dart VM installs
      # its own unhandled-exception filter, prints the frame and exits, so the
      # exception never reaches Windows Error Reporting and no dump is written.
      - name: Reproduce
        id: repro
        continue-on-error: true
        run: ../../scripts/run_emulator_tests.sh 2>&1 | tee "$RUNNER_TEMP/repro.log"

      - name: What was built
        if: always()
        run: |
          find .dart_tool -name 'firebase_ffi.dll' -o -name 'firebase_ffi.pdb' | while read f; do
            ls -l "$f"
          done

      # The crash line names a module and an RVA. With the PDB beside it that
      # resolves to a function and a line, which is the whole point of the run.
      - name: Symbolize
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'repro.log'
          $rvas = @()
          if (Test-Path $log) {
            $rvas = Select-String -Path $log -Pattern 'firebase_ffi\.dll\+0x([0-9a-fA-F]+)' -AllMatches |
                    ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          }
          if (-not $rvas) { Write-Host 'no firebase_ffi.dll offset in the log -- did it crash?'; exit 0 }
          Write-Host "offsets: $($rvas -join ', ')"

          $pdb = Get-ChildItem -Recurse -Filter firebase_ffi.pdb .dart_tool -EA SilentlyContinue | Select-Object -First 1
          $dll = Get-ChildItem -Recurse -Filter firebase_ffi.dll .dart_tool -EA SilentlyContinue |
                 Where-Object { Test-Path (Join-Path $_.Directory.FullName 'firebase_ffi.pdb') } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem -Recurse -Filter firebase_ffi.dll .dart_tool -EA SilentlyContinue | Select-Object -First 1 }
          Write-Host "pdb: $(if ($pdb) { $pdb.FullName } else { 'none' })"
          Write-Host "dll: $(if ($dll) { $dll.FullName } else { 'none' })"

          # Whichever resolver the image has. llvm-symbolizer reads the PDB
          # named by the DLL's debug directory; cdb needs the module loaded.
          $sym = @(
            'C:\Program Files\LLVM\bin\llvm-symbolizer.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $cdb = @(
            'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe',
            'C:\Program Files\Windows Kits\10\Debuggers\x64\cdb.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "llvm-symbolizer: $(if ($sym) { $sym } else { 'absent' })"
          Write-Host "cdb: $(if ($cdb) { $cdb } else { 'absent' })"

          foreach ($rva in $rvas) {
            Write-Host "=== firebase_ffi.dll+0x$rva ==="
            if ($sym -and $dll) {
              & $sym --obj="$($dll.FullName)" --demangle --functions=linkage --inlines "0x$rva"
            }
            if ($cdb -and $dll) {
              # Load at a known base so the RVA is an address cdb can name.
              & $cdb -z "$($dll.FullName)" -y "$($pdb.Directory.FullName)" -c "ln 0x`$(0x10000000+0x$rva); q" 2>&1 |
                Select-String -Pattern 'firebase_ffi!' -Context 0,1
            }
            if (-not $sym -and -not $cdb) { Write-Host 'no resolver on this image; the PDB is uploaded below' }
          }

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-evidence
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/repro.log
            packages/firebase_ffi/.dart_tool/**/firebase_ffi.pdb
            packages/firebase_ffi/.dart_tool/**/firebase_ffi.dll
